<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>My POP Collection</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f7;color:#18263d;margin:0}header{background:#18263d;color:white;padding:20px}main{max-width:800px;margin:auto;padding:12px}section{background:white;padding:16px;border-radius:14px;margin-bottom:12px}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #aaa;margin:4px}input,select{width:95%}button{background:#2459b9;color:white}article{border-bottom:1px solid #ccc;padding:12px}.warn{background:#ffe16b;color:#382900;padding:16px;font-weight:bold}video{width:100%}@media print{button,#editor,#controls,#archive,header{display:none}section{padding:0}}</style><header><h1>My POP Collection</h1><small>Versão 1.1 — leitor alternativo</small><div id="total"></div></header><main><section id="controls"><button onclick="openForm(false)">Registar</button><button onclick="openForm(false,true)">Registo em série</button><button onclick="openForm(true)">Consultar em loja</button><button onclick="print()">PDF / Imprimir</button><input id="search" placeholder="Pesquisar coleção" oninput="render()"><select id="filter" onchange="render()"></select><label><input type="checkbox" id="prices" style="width:auto" onchange="render()">Mostrar preços</label></section><section id="editor" hidden><h2 id="heading"></h2><input id="barcode" placeholder="Código de barras" inputmode="numeric" oninput="check()"><button onclick="scan()">Digitalizar</button><video id="cam" hidden playsinline></video><div id="warning"></div><form id="form"><input id="name" placeholder="Nome" required><input id="num" placeholder="Número da caixa"><select id="group"></select><input id="newGroup" placeholder="Ou criar novo grupo"><select id="edition"><option>Normal</option><option>Chase</option><option>Exclusive</option><option>Limited Edition</option><option>Glow in the Dark</option><option>Flocked</option><option>Metallic</option><option>Diamond</option><option>Outras</option></select><input id="qty" type="number" min="1" value="1" required><input id="price" type="number" min="0" step=".01" placeholder="Valor de mercado (€)"><input id="notes" placeholder="Observações"><select id="status"><option>Coleção</option><option>Desejos</option></select><button>Guardar</button></form><button onclick="stop();$('editor').hidden=true">Fechar</button></section><section><h2 id="title">Coleção</h2><div id="list"></div></section><section id="archive"><h2>Arquivo privado local</h2><p>Sincronização Google ainda não disponível. Exporta uma cópia e guarda-a no Drive.</p><button onclick="backup()">Exportar cópia</button><button onclick="$('file').click()">Importar cópia</button><input id="file" type="file" accept=".json" hidden><button onclick="window.open('https://drive.google.com','_blank','noopener')">Abrir Drive</button></section></main><script>const $=x=>document.getElementById(x),keys=['barcode','name','num','group','edition','qty','price','notes','status'];let data=[];try{data=JSON.parse(localStorage.getItem('pop')||'[]')}catch{}let editId=null,series=false,stream,timer;function groups(){return [...new Set(data.map(x=>x.group))].sort()}function choices(id,first){let s=$(id),v=s.value;s.replaceChildren(new Option(first,''),...groups().map(g=>new Option(g,g)));s.value=v}function save(d){try{localStorage.setItem('pop',JSON.stringify(d));data=d;render();return true}catch{alert('Erro ao guardar');return false}}function text(t,tag='div'){let e=document.createElement(tag);e.textContent=t;return e}function button(t,f){let e=text(t,'button');e.onclick=f;return e}function render(){choices('filter','Todos os grupos');$('total').textContent=data.filter(x=>x.status==='Coleção').reduce((a,x)=>a+ +x.qty,0)+' figuras · '+groups().length+' grupos';$('title').textContent=$('filter').value||'Coleção completa';$('list').replaceChildren();let q=$('search').value.toLowerCase();for(let x of data.filter(x=>(!$('filter').value||x.group===$('filter').value)&&keys.map(k=>x[k]).join(' ').toLowerCase().includes(q)).sort((a,b)=>a.group.localeCompare(b.group)||a.num.localeCompare(b.num,undefined,{numeric:true}))){let a=document.createElement('article');a.append(text(x.group+' · '+x.name+' #'+x.num,'strong'),text(x.edition+' · '+x.qty+' un. · '+x.status),text(x.notes));if($('prices').checked)a.append(text(x.price?x.price+' €':'Sem avaliação'));a.append(button('Editar',()=>{openForm(false);editId=x.id;keys.forEach(k=>$(k).value=x[k]);check()}),button('Eliminar',()=>{if(confirm('Eliminar?'))save(data.filter(y=>y.id!==x.id))}),button('Consultar preço',()=>window.open('https://www.ebay.com/sch/i.html?LH_Sold=1&LH_Complete=1&_nkw='+encodeURIComponent('Funko Pop '+x.name+' '+x.num+' '+x.edition),'_blank','noopener')));$('list').append(a)}}function openForm(c,s=false){stop();series=s;editId=null;$('editor').hidden=false;$('form').hidden=c;$('heading').textContent=c?'Consulta em loja — não grava':s?'Registo em série':'Novo Funko Pop';$('form').reset();$('barcode').value='';choices('group','Selecionar grupo');$('group').value=$('filter').value;check()}function check(){let b=$('barcode').value.trim(),m=data.filter(x=>b&&x.barcode===b&&x.status==='Coleção');$('warning').className=m.length?'warn':'';$('warning').textContent=m.length?'⚠ Possível duplicado: '+m.map(x=>x.name+' #'+x.num+' '+x.edition).join(', '):b?'Código ainda não registado na tua coleção.':''}$('form').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(keys.map(k=>[k,$(k).value.trim()]));x.group=$('newGroup').value.trim()||x.group;if(!x.group||!x.name)return alert('Indica nome e grupo');x.id=editId||crypto.randomUUID();if(data.some(y=>y.id!==x.id&&y.status==='Coleção'&&((x.barcode&&y.barcode===x.barcode)||(x.num&&y.num===x.num&&y.name.toLowerCase()===x.name.toLowerCase())))&&!confirm('Possível duplicado. Guardar?'))return;if(save(data.filter(y=>y.id!==x.id).concat(x))){if(series){openForm(false,true);$('group').value=x.group}else{$('editor').hidden=true;stop()}}};let reader=null,scanGeneration=0;function stop(){scanGeneration++;clearInterval(timer);if(reader){try{reader.reset()}catch{}reader=null}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('cam').srcObject=null;$('cam').hidden=true}async function scan(){stop();const generation=scanGeneration;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Abre a aplicação em HTTPS no Chrome');$('cam').hidden=false;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(generation!==scanGeneration){stream.getTracks().forEach(t=>t.stop());return}$('cam').srcObject=stream;await $('cam').play();let detector=null;try{if(window.BarcodeDetector)detector=new BarcodeDetector()}catch{}let accept=v=>{if(generation!==scanGeneration)return;$('barcode').value=v;stop();check()};if(detector){let busy=false;timer=setInterval(async()=>{if(busy)return;busy=true;try{let r=await detector.detect($('cam'));if(r.length)accept(r[0].rawValue)}catch{}finally{busy=false}},350)}else{if(!window.ZXing)await new Promise((resolve,reject)=>{let script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';script.onload=resolve;script.onerror=()=>reject(Error('Não foi possível carregar o leitor alternativo'));document.head.append(script)});if(generation!==scanGeneration)return;reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromStream(stream,$('cam'),result=>{if(result)accept(result.getText())})}}catch(e){stop();alert('Câmara: '+e.name+' — '+e.message+' . Podes introduzir o código manualmente.')}}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='my-pop-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.every(x=>x&&['id',...keys].every(k=>typeof x[k]==='string')&&Number.isInteger(+x.qty)&&+x.qty>0))throw Error();if(confirm('Substituir coleção local?'))save(d)}catch{alert('Cópia inválida')}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
